name: CI

# hub 仓的 CI 门禁。此前 hub 没有任何 ci.yml——发布编排器（release/trainctl，
# 约 2.8k 行，决定 16 个仓的版本号）既不在 CI 里跑测试，也不在 make test /
# make lint 的覆盖范围内：改路由、改断言、改 tag 序全靠人肉 review，而它出过
# 两次真实事故（1.24.0/1.24.1 连续两列车 server 镜像缺当次修复）。
#
# 四道门：
#   1. trainctl —— 编排器自身的 vet + 单测（改动断言/编辑器的第一道拦截）
#   2. scripts —— 仓内 shell 脚本的 shellcheck（setup.sh / smoke-full.sh 等）
#   3. deploy-limits —— 部署模板一致性（反代体积上限默认值必须一致且 ≥ 8GiB；
#      2026-10-23 的 413 事故就是「改 4 处漏 1 处」导致的复发隐患）
#   4. smoke   —— 全能力真机冒烟（scripts/smoke-full.sh，49+ 项断言）
#      此前只靠人工本地跑，2.0.0 破坏性变更后三条断言恒红而无人知晓
#      （门禁失效的事实胜于门禁的存在）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trainctl:
    name: trainctl + scripts vet/test
    runs-on: ubuntu-latest
    env:
      # 显式 auto:覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.work /
      # go.mod 的 toolchain 地板再抬时,Go 能自动拉取而不是构建失败
      # (2026-10-26 实测:浮动 go-version 1.26 拿到 1.26.9,撞 go.work 的
      #  go 1.26.10 地板 ⇒ 真机冒烟死在构建阶段,一条断言都没跑到)。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5；勿升 v7:强制 GOTOOLCHAIN=local,与 toolchain 地板冲突(job 里已显式 GOTOOLCHAIN=auto 覆盖)
        with:
          go-version: "1.26.10"
      - name: go vet
        run: |
          (cd release/trainctl && GOWORK=off go vet ./...)
          (cd scripts && GOWORK=off go vet ./...)
      - name: go test
        run: |
          (cd release/trainctl && GOWORK=off go test ./...)
          (cd scripts && GOWORK=off go test ./...)
      - name: gofmt 校验
        run: |
          unformatted="$(gofmt -l release/trainctl/ scripts/)"
          if [ -n "$unformatted" ]; then
            echo "gofmt 未格式化: $unformatted"
            exit 1
          fi

  go-version-floor:
    name: Go 版本地板对账
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-26 实测（dependabot PR 分支失败日志）：workflow 用浮动
      # go-version "1.26" ⇒ runner 拿到 1.26.9 < go.work 地板 1.26.10 ⇒
      # 「go: ../go.work requires go >= 1.26.10」⇒ 真机冒烟死在**构建阶段**,
      # 一条断言都没跑到 ⇒ 发版门禁失效且红的原因与冒烟无关(噪声)。
      # 本门禁断言「所有 workflow 的 go-version 精确且 ≥ 地板」+「用 setup-go
      # 的 job 显式 GOTOOLCHAIN=auto」,并自带变异自证(改低版本 ⇒ 必红)。
      - name: go-version 必须精确且 ≥ go.work 地板
        run: bash scripts/check-go-version-floor.sh --selfcheck

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck（仓内 shell 脚本）
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "无 shell 脚本可检"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x "${files[@]}"

  action-pins:
    name: action pin 完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-24 实录：本仓 ci.yml 里 5 处 checkout 有 1 处把 SHA 打错一位
      # （c→d）⇒ GitHub 在**解析 action 阶段**就失败 ⇒ 那个 job 从未跑过一行
      # 断言 ⇒ 门禁空转，而 CI 只显示一个「红」，人容易当成环境问题忽略。
      # 本 job 的意义：① 机械校验 pin 格式/一致性；② --remote 用 GitHub API
      # 验每个 pin 真是合法 commit（抓「全仓一致地打错」）；③ 自证扫到几个 pin。
      - name: action pin 必须全是合法 commit（格式+一致性+远端校验）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-action-pins.sh --remote

  required-checks:
    name: CI 在合并路径上
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-24 实录：全生态 17 仓体检分支保护，发现 **hub 是唯一把 CI 漏在
      # required checks 之外的仓**——main 的 required 只有 Secret Scan ⇒ CI 的
      # 七道门禁全不在合并路径上 ⇒ 直推 main 不受任何门禁约束（push 只提示
      # 「Bypassed rule violations」，人容易忽略）⇒ 门禁对最需要它的仓形同虚设。
      # 本 job 自证「CI 的每个 job 都在 required checks 里」⇒ CI 改名/加 job 后
      # 若忘了同步分支保护，立刻报出来，而不是等某次合并被莫名挡住。
      - name: CI 的每个 job 都必须在 required checks 里
        env:
          GH_TOKEN: ${{ secrets.PB_BOT_TOKEN || github.token }}
        run: bash scripts/check-required-checks.sh --repo pigeonbox/pigeonbox

  nas-sync-gate:
    name: NAS 漂移门禁的检出形态判别
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-24 实录：sync.sh check 的「实际」侧写死取 origin/main，而 CI 的
      # **push 事件检出的是列车分支**(train/<v>) ⇒ 拿本车新内容比上一车旧内容
      # ⇒ 必然假漂移 ⇒ 三个 NAS 物化 PR 全红 ⇒ auto-merge 被阻断 ⇒ 整条
      # 3.3.15 列车卡在 draft。
      # 这类「同一内容、不同检出形态 ⇒ 不同结论」的缺陷，只能靠**把两种形态都
      # 跑一遍并要求结论一致**来机械拦住 ⇒ 本 job 就是那个判别测试。
      - name: 同一份内容在不同检出形态下必须给出同一结论
        run: bash scripts/check-nas-sync-gate.sh
      # sync.sh 的**工作区根推导**判据自测（2026-10-31 新增）。
      #
      # 缺陷形态：`check --all` 的 root 少算一层 `..` ⇒ 各 NAS 仓路径落到
      # 不存在的目录 ⇒ **误报 7 处漂移**；而单仓模式（传绝对路径 --dir）是绿的
      # ⇒ 两种模式结果矛盾 ⇒ 极难发现。
      # ⇒ 本 job 跑**真实脚本**（临时工作区 + 真 git 仓 + 真物化），
      #    断言「不误报」+「单仓与 --all 结论一致」+「换 cwd 结论不变」。
      - name: sync.sh 工作区根推导自测
        run: bash deploy/nas/sync_selftest.sh

  shell-var-boundary:
    name: shell 变量名边界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-26 审计 P2：门禁此前只扫 hub 的 scripts/*.sh ⇒ NAS 各仓的运维
      # 脚本（真机上跑的正是这些）不在射程内 ⇒ 下一份 NAS 脚本里出现
      # 「变量名后紧跟全角括号」时本门禁全绿，而真机脚本当场炸/静默拼错路径。
      # ⇒ 把 NAS 各仓检出到同一 workspace（这些路径在 hub 仓是 gitignore 的
      #    独立仓目录，不污染 hub 工作树）⇒ 射程自动覆盖。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/fnos
          path: fnos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/qnap
          path: qnap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/openwrt
          path: openwrt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/synology
          path: synology
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/ugreen
          path: ugreen
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/terramaster
          path: terramaster
      # 变量名后不得紧跟非 ASCII 字符（全角括号/冒号/汉字）⇒ bash/ash 把它并进变量名
      # ⇒ set -u 下报 "VAR（: unbound variable"、不带 set -u 则静默取到空值。
      # shellcheck 不报（语法合法）⇒ 只能机械拦（2026-10-24 实录：冒烟脚本炸在
      # 第 527 行，运维脚本同类）。
      - name: 变量名后不得紧跟非 ASCII 字符(hub scripts + NAS 各仓运维脚本)
        run: bash scripts/check-shell-var-boundary.sh --selfcheck

  no-bare-go:
    name: 禁裸 go（跨仓 AST 扫描）
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v5 强制的 GOTOOLCHAIN=local ⇒ toolchain 地板
      # 再抬时 Go 能自动拉取，而不是构建失败（与 trainctl / smoke 两个 job 同口径）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-28：裸 goroutine 的 panic **无人接** ⇒ 直接带走整个进程。
      # server/fnos/openwrt/qnap 四个平台小仓代码量小、尚无仓内守卫（core 与 p2p
      # 已在各自仓内用 internal/convention 的守卫自守 ⇒ 不在此重复扫描）
      # ⇒ 由本门禁跨仓扫描，检出形态沿用 shell-var-boundary job 的先例
      #（这些路径在 hub 仓是 gitignore 的独立仓目录，不污染 hub 工作树）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/server
          path: server
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/fnos
          path: fnos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/openwrt
          path: openwrt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/qnap
          path: qnap
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5；勿升 v7
        with:
          go-version: "1.26.10"
      # 放行项每仓 1 处 = 主服务协程（panic 应带崩进程让 supervisor 重启它）
      - name: 禁裸 go（AST 级判定）
        run: bash scripts/check-no-bare-go.sh

  deploy-limits:
    name: 部署模板一致性（反代体积上限）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-23 413 事故的复发防线：同一份反代上限散落在 compose/env/nginx 模板
      # 多处，修复时改了 4 处漏了第 5 处（仓根 .env.example 仍是 1024m）⇒ 新部署
      # 拿到的仍是 1GiB 防线，而业务上限可配 4GiB ⇒ 同一不变量被破坏 ⇒ 复发 413。
      # 「改一处漏三处」靠人记不住 ⇒ 用门禁机械保证：任一处被单独改动即红。
      - name: 反代体积上限默认值必须一致且 ≥ 8GiB
        run: bash scripts/check-body-size-limits.sh

  docs-consistency:
    name: 文档↔代码对账（错误码表 / 环境变量）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-26 审计新增：这两份清单「代码是真相、文档靠人同步」⇒ 历史上
      # **没有任何门禁** ⇒ 漂移一直累积（实测：环境变量文档漏 1 个 PB_*、
      # 错误码表漏 1 个码）。⇒ 做成机械检查，CI 必跑。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/contracts
          path: contracts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/core
          path: core
      - name: 错误码表 ⊇ errcode 常量；环境变量文档 ⊇ core 绑定的 PB_*
        run: bash scripts/check-docs-consistency.sh --selfcheck

  toolchain-pins:
    name: 前端类型检查工具链跨仓对账（vue-tsc 钉版）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-30 实录：frontend-core 以**源码 tgz** 被三个平台仓消费（fnos/openwrt/
      # qnap 的 web/ 把 node_modules/@pigeonbox/frontend-core/src/** 一起纳入自己的
      # vue-tsc 类型检查）⇒ **库的类型检查结论 = 消费方的类型检查结论**，库自己 CI 绿
      # 不代表消费方绿。本轮 fnos 重解析 web 锁文件后拿到 vue-tsc 3.3.14 ⇒ 该版本对
      # <script setup> 里 reactive() 绑定的 v-model 嵌套成员**误生成 .value 访问**
      # ⇒ TS2339 ×20 ⇒ 三个消费方 typecheck 全红 ⇒ 4.4.0 列车终验被挡。
      # 逐版本扫（同一份 v0.11.40 源码 + 同一份 tsconfig）：3.3.14→20 条；
      # 3.3.13/3.3.12/3.3.11/3.2.9→0 条 ⇒ 回归只在 3.3.14，而让锁文件漂进去的正是
      # "vue-tsc": "^3.1.5" 这种**开放区间**。
      # ⇒ 本门禁要求：① 四仓 vue-tsc 版本逐字相同；② 必须是**精确版本**（区间会让
      # 锁文件随时漂进上游回归版，且漂移只在消费方显红）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/frontend-core
          path: frontend-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/fnos
          path: fnos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/openwrt
          path: openwrt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pigeonbox/qnap
          path: qnap
      - name: 守卫自检（注入三类故障必须逐条判红）
        run: bash scripts/check-toolchain-pins.sh --selfcheck
      - name: 四仓 vue-tsc 钉版必须一致且为精确版本
        run: bash scripts/check-toolchain-pins.sh

  smoke:
    name: 全能力真机冒烟
    runs-on: ubuntu-latest
    env:
      # 显式 auto:覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ toolchain 地板
      # 再抬时 Go 自动拉取,而不是「go: ../go.work requires go >= X」构建失败
      # (2026-10-26 实录:go-version 浮动 1.26 → 实际 1.26.9 < 地板 1.26.10
      #  ⇒ 冒烟门禁死在构建阶段,一条断言都没跑到 ⇒ 发版门禁失效)。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5；勿升 v7
        with:
          go-version: "1.26.10"
      - name: 检出生态模块仓（冒烟要编 server，其依赖 contracts/core）
        run: |
          set -euo pipefail
          for r in contracts core server fnos openwrt qnap p2p; do
            git clone -q --depth 1 "https://github.com/pigeonbox/$r.git" "$r"
          done
      - name: 装 Redis（冒烟要起临时实例）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      # 2026-10-26 审计 P0：冒烟会改目标实例的用户配置（开放注册+配额下调），
      # 还原此前有三条**不影响 FAIL 计数**的静默逃逸口 ⇒ 绿冒烟却把生产实例
      # 留在降级态；且还原没有任何 trap 保护。本门禁用 mock 管理端把四条逃逸口
      # 逐条跑成可观测的红，并自带变异自检（证明门禁不是空转）。
      - name: 冒烟「还原用户配置」守卫（无静默逃逸口 + trap 生效）
        run: bash scripts/check-smoke-user-config-restore.sh
      - name: 跑冒烟（49+ 项断言）
        run: bash scripts/smoke-full.sh
