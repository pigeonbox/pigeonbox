name: CI

# hub 仓的 CI 门禁。此前 hub 没有任何 ci.yml——发布编排器（release/trainctl，
# 约 2.8k 行，决定 16 个仓的版本号）既不在 CI 里跑测试，也不在 make test /
# make lint 的覆盖范围内：改路由、改断言、改 tag 序全靠人肉 review，而它出过
# 两次真实事故（1.24.0/1.24.1 连续两列车 server 镜像缺当次修复）。
#
# 四道门：
#   1. trainctl —— 编排器自身的 vet + 单测（改动断言/编辑器的第一道拦截）
#   2. scripts —— 仓内 shell 脚本的 shellcheck（setup.sh / smoke-full.sh 等）
#   3. deploy-limits —— 部署模板一致性（反代体积上限默认值必须一致且 ≥ 8GiB；
#      2026-10-23 的 413 事故就是「改 4 处漏 1 处」导致的复发隐患）
#   4. smoke   —— 全能力真机冒烟（scripts/smoke-full.sh，49+ 项断言）
#      此前只靠人工本地跑，2.0.0 破坏性变更后三条断言恒红而无人知晓
#      （门禁失效的事实胜于门禁的存在）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trainctl:
    name: trainctl + scripts vet/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5；勿升 v7:强制 GOTOOLCHAIN=local 与 toolchain 地板冲突
        with:
          go-version: "1.26"
      - name: go vet
        run: |
          (cd release/trainctl && GOWORK=off go vet ./...)
          (cd scripts && GOWORK=off go vet ./...)
      - name: go test
        run: |
          (cd release/trainctl && GOWORK=off go test ./...)
          (cd scripts && GOWORK=off go test ./...)
      - name: gofmt 校验
        run: |
          unformatted="$(gofmt -l release/trainctl/ scripts/)"
          if [ -n "$unformatted" ]; then
            echo "gofmt 未格式化: $unformatted"
            exit 1
          fi

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck（仓内 shell 脚本）
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "无 shell 脚本可检"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x "${files[@]}"

  action-pins:
    name: action pin 完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-24 实录：本仓 ci.yml 里 5 处 checkout 有 1 处把 SHA 打错一位
      # （c→d）⇒ GitHub 在**解析 action 阶段**就失败 ⇒ 那个 job 从未跑过一行
      # 断言 ⇒ 门禁空转，而 CI 只显示一个「红」，人容易当成环境问题忽略。
      # 本 job 的意义：① 机械校验 pin 格式/一致性；② --remote 用 GitHub API
      # 验每个 pin 真是合法 commit（抓「全仓一致地打错」）；③ 自证扫到几个 pin。
      - name: action pin 必须全是合法 commit（格式+一致性+远端校验）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-action-pins.sh --remote

  shell-var-boundary:
    name: shell 变量名边界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 变量名后紧跟非 ASCII 字符（全角括号/冒号/汉字）⇒ bash/ash 把它并进变量名
      # ⇒ set -u 下报 "VAR（: unbound variable"、不带 set -u 则静默取到空值。
      # shellcheck 不报（语法合法）⇒ 只能机械拦（2026-10-24 实录：冒烟脚本炸在
      # 第 527 行，运维脚本同类）。
      - name: 变量名后不得紧跟非 ASCII 字符
        run: bash scripts/check-shell-var-boundary.sh

  deploy-limits:
    name: 部署模板一致性（反代体积上限）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-10-23 413 事故的复发防线：同一份反代上限散落在 compose/env/nginx 模板
      # 多处，修复时改了 4 处漏了第 5 处（仓根 .env.example 仍是 1024m）⇒ 新部署
      # 拿到的仍是 1GiB 防线，而业务上限可配 4GiB ⇒ 同一不变量被破坏 ⇒ 复发 413。
      # 「改一处漏三处」靠人记不住 ⇒ 用门禁机械保证：任一处被单独改动即红。
      - name: 反代体积上限默认值必须一致且 ≥ 8GiB
        run: bash scripts/check-body-size-limits.sh

  smoke:
    name: 全能力真机冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5；勿升 v7
        with:
          go-version: "1.26"
      - name: 检出生态模块仓（冒烟要编 server，其依赖 contracts/core）
        run: |
          set -euo pipefail
          for r in contracts core server fnos openwrt qnap p2p; do
            git clone -q --depth 1 "https://github.com/pigeonbox/$r.git" "$r"
          done
      - name: 装 Redis（冒烟要起临时实例）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: 跑冒烟（49+ 项断言）
        run: bash scripts/smoke-full.sh
