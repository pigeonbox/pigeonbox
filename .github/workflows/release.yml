name: Release

# 生态列车快照发布：tag v* → Release(说明 = release/train.yaml 组件矩阵 + 产物线导航;
# train.yaml 缺失时——如历史 tag 重跑——退回静态模板)。Latest 恒属于本线,
# 组件回挂(desktop-v*/fnos-v*/openwrt-v*/p2p-v*/synology-v*/qnap-v*/ugreen-v*/terramaster-v*)一律 --latest=false。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5；勿升 v7:强制 GOTOOLCHAIN=local 与 toolchain 地板冲突
        with:
          go-version: "1.26"
      # 说明由列车真相源渲染(trainctl notes),与 verify/finalize 同一实现;
      # 历史 tag 重跑(树内无 trainctl)回退 v1 bash 渲染
      - name: 生成说明(列车组件矩阵)
        run: |
          if [ -d release/trainctl ]; then
            (cd release/trainctl && GOWORK=off go build -o /tmp/trainctl .)
            /tmp/trainctl notes "${{ github.ref_name }}" > notes.md
          else
            bash scripts/release-train.sh notes "${{ github.ref_name }}" > notes.md
          fi
      - name: 创建 Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: "PigeonBox ${{ github.ref_name }}"
          body_path: notes.md
          make_latest: true
