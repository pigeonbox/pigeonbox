name: Train Orchestrator

# 发布列车 v2 状态机编排器(设计稿: docs/specs/2026-10-12-release-train-v2-design.md;
# run「一条命令开完一趟车」的语义见 docs/specs/2026-10-27-release-train-v3-one-command-design.md)。
#
# 两种走法:
#   - phase=run  : **一条命令开完一趟车**(2026-10-27 起)。同一次运行内自轮询:
#                  库线(发 tag+等可消费) → bump → 等 PR 合并 → tag → 等产物齐
#                  → charts → 全量 verify → 出 hub 快照。发车者只发一条命令。
#   - phase=advance: 单步推进(组件回调 / sweep 唤醒 / 人工兜底)——run 的接力与
#                  崩溃恢复路径,也保留给只读对账。
# 另有两个短平快单步:phase=bump(只开列车) / phase=tag(只推 tag),不进长等待环。
# 唤醒源: 手动 dispatch / 组件仓 Release 完成回调(repository_dispatch train-advance)/
#         sweep(cron)。⚠️ GitHub 的 schedule 实测每 2~4 小时才跑一次 ⇒ cron 只是
#         兜底,正常路径靠 phase=run 在同一次运行里自推进。
# 写操作凭据: org 机器人 PB_BOT_TOKEN(classic PAT: repo+workflow+read:packages);
# 只读 phase 可用 GITHUB_TOKEN(旧 TRAIN_PAT 已随 release-bot 切换删除,
# 见 docs/release-bot-setup.md)。
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "run=一条命令开完整趟车 / bump=只开列车 / tag=推 tag / advance=单步推进"
        type: choice
        options: [run, advance, bump, tag]
        default: run
      train:
        description: "列车号(run/bump 必填,如 4.0.6)"
        required: false
      set:
        description: "库线钉版覆盖(空格分隔 k=v,如 core=v0.32.20);缺省=自动跟随各库仓最新已发布 tag"
        required: false
      hotfix:
        description: "子集列车(train.yaml 记 hotfix=true)"
        type: boolean
        default: false
      freeze_libs:
        description: "冻结库线钉版(不自动跟随最新已发布 tag)"
        type: boolean
        default: false
      timeout:
        description: "run 阶段的等待上限(如 90m)"
        required: false
  repository_dispatch:
    types: [train-advance]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: train-orchestrator
  cancel-in-progress: false

env:
  BOT: ${{ secrets.PB_BOT_TOKEN || github.token }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # run 阶段在同一次运行里等 PR 合并 + 等产物齐 + 终验(实测一趟车 20~40 分钟,
    # 慢的能到 1 小时+)⇒ job 超时必须给足,否则中途被杀 = 列车半途而废。
    timeout-minutes: 180
    env:
      GOTOOLCHAIN: auto # 覆盖 setup-go v7 的 GOTOOLCHAIN=local,地板再抬时自动拉取
    steps:
      # 快速预判:非人工 dispatch 且 train.yaml state=shipped 且无在途列车 PR →
      # 跳过重活(sweep 空跑克隆 15 仓+装工具链+构建是纯浪费;
      # 人工 dispatch 永远执行——显式意图优先)。
      - name: 快速预判
        id: pre
        env:
          GH_TOKEN: ${{ github.token }} # 只读,勿动 PAT
        run: |
          set -euo pipefail
          skip=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            ST=$(gh api repos/pigeonbox/pigeonbox/contents/release/train.yaml --jq .content | base64 -d | awk -F': *' '$1=="state"{print $2}')
            OPEN=$(gh pr list -R pigeonbox/pigeonbox --state open --search "head:train/" --json number --jq 'length')
            echo "state=$ST open_train_prs=$OPEN"
            [ "$ST" = "shipped" ] && [ "$OPEN" = "0" ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.pre.outputs.skip != 'true'
        with:
          token: ${{ env.BOT }}

      - name: 检出生态仓(hub 根子目录,与本地 make setup 布局一致——
              sync.sh/finalize 全量 verify 依赖该布局;trainctl 同名解析)
        if: steps.pre.outputs.skip != 'true'
        env:
          CK: ${{ env.BOT }}
        run: |
          set -euo pipefail
          # ⭐ 并行克隆(2026-10-27 提速):15 个仓**串行** clone 要好几分钟,
          # 而这一步在每次 run/advance 开头都要重做一遍 ⇒ 并行后耗时≈最慢的
          # 一个仓。不用 --depth/--filter:列车分支要快进合并
          # (bump.go 的 switchTrainBranch),浅克隆会让远端同名列车分支丢历史
          # ⇒ push non-fast-forward ⇒ 列车卡死(3.3.16 同型事故)。
          pids=""
          for r in frontend frontend-core contracts core kit p2p server \
                   fnos openwrt qnap synology ugreen terramaster desktop charts; do
            git clone -q "https://x-access-token:${CK}@github.com/pigeonbox/$r.git" "$r" &
            pids="$pids $!"
          done
          fail=0
          for p in $pids; do wait "$p" || fail=1; done
          if [ "$fail" != "0" ]; then
            echo "::error::检出生态仓失败(见上)"; exit 1
          fi
          echo "✓ 15 个生态仓检出完成"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5；勿升 v7:强制 GOTOOLCHAIN=local,与 toolchain 地板冲突(job 里已显式 GOTOOLCHAIN=auto 覆盖)
        if: steps.pre.outputs.skip != 'true'
        with:
          go-version: "1.26.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pre.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: 构建 trainctl
        if: steps.pre.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p bin
          (cd release/trainctl && GOWORK=off go build -o "$GITHUB_WORKSPACE/bin/trainctl" .)
          ./bin/trainctl get train >/dev/null # 冒烟:真相源可读

      - name: 执行编排 phase
        if: steps.pre.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ env.BOT }}
          PHASE: ${{ github.event.inputs.phase || 'advance' }}
          TRAIN: ${{ github.event.inputs.train }}
          SETS: ${{ github.event.inputs.set }}
          HOTFIX: ${{ github.event.inputs.hotfix }}
          FREEZE: ${{ github.event.inputs.freeze_libs }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COMPONENT: ${{ github.client_payload.component }}
        run: |
          set -euo pipefail
          git config --global user.name "pigeonbox-ci"
          git config --global user.email "pigeonbox-ci@users.noreply.github.com"
          [ -n "$COMPONENT" ] && echo "── 回调唤醒: 组件 $COMPONENT 已完成"

          # ── 等待期可观测性(Refs pigeonbox/pigeonbox#347 观察项⑤)──
          # 症状(5.8.0 实录):trainctl 的 run/advance 在等待环(等 PR 合并 / 等产物齐)
          # 里几十分钟只在状态**变化**时才打印一行 ⇒ gh run view --log 拿不到中途进度,
          # 只能反复读 release/train.yaml 的 state 间接猜进度。
          # 做法:trainctl 放后台跑,前台每 30s 把「phase / train.yaml state / 已等待
          # 时长 / 最近一次状态变化 / trainctl 尾部输出」**整块覆写**进
          # $GITHUB_STEP_SUMMARY(覆写=始终只留最新一份快照,不刷屏),同一行打进步骤
          # 日志;每 10s 轮询只为尽快发现 trainctl 退出(收尾最多多等 10s)。
          # ⚠️ 纯观测:不碰 trainctl 的状态机/输出语义/超时,退出码原样透传,
          #    不改任何唤醒源与阶段分支;state/train 取自本地 release/train.yaml
          #    (trainctl 的 waitStep 每轮 syncHubMain 会把它拉齐到 origin/main)。
          observe_trainctl() {
            local log="${RUNNER_TEMP}/trainctl-observe.log"
            : > "$log"
            ./bin/trainctl "$@" > "$log" 2>&1 &
            local pid=$!
            local start ticks=0 last_state="" last_change="" rc
            start=$(date +%s)
            # 落一份 summary 快照(整块覆写);rc_desc=「运行中」或最终退出码。
            snapshot() {
              local rc_desc="$1" train state now elapsed
              train=$(awk -F': *' '$1=="train"{print $2; exit}' release/train.yaml 2>/dev/null || true)
              state=$(awk -F': *' '$1=="state"{print $2; exit}' release/train.yaml 2>/dev/null || true)
              [ -n "$train" ] || train="未知"
              [ -n "$state" ] || state="未知"
              now=$(date +%s)
              if [ "$state" != "$last_state" ]; then
                if [ -n "$last_state" ]; then
                  last_change="$(date '+%F %T')（${last_state} → ${state}）"
                else
                  last_change="$(date '+%F %T')（起始观测：${state}）"
                fi
                last_state="$state"
              fi
              elapsed=$(awk -v s="$start" -v n="$now" 'BEGIN{d=n-s; printf "%dh%02dm%02ds", int(d/3600), int(d%3600/60), d%60}')
              {
                printf '## 列车编排等待观测（phase=%s，train=%s）\n\n' "$PHASE" "$train"
                printf -- '- 当前 phase：%s\n' "$PHASE"
                printf -- '- train.yaml state：%s\n' "$state"
                printf -- '- 已等待时长：%s\n' "$elapsed"
                printf -- '- 最近一次状态变化：%s\n' "$last_change"
                printf -- '- trainctl 退出码：%s\n' "$rc_desc"
                printf '\n<details><summary>trainctl 最近输出（尾 5 行）</summary>\n\n```\n'
                tail -n 5 "$log" 2>/dev/null || true
                printf '```\n\n</details>\n'
              } > "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "⏳ [观测] phase=$PHASE state=$state 已等待=$elapsed 最近变化=$last_change"
            }
            snapshot "运行中"
            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              ticks=$((ticks + 1))
              if [ $((ticks % 3)) -eq 0 ]; then
                snapshot "运行中"
              fi
            done
            set +e
            wait "$pid"
            rc=$?
            set -e
            snapshot "$rc"
            echo "──── trainctl 完整输出（退出码 $rc） ────"
            cat "$log"
            return "$rc"
          }

          case "$PHASE" in
            run)
              # 一条命令开完整趟车(库线 → bump → 等合并 → tag → 等产物 → 终验 → 快照)
              [ -n "$TRAIN" ] || { echo "::error::phase=run 需要 train 输入(列车号)"; exit 1; }
              ARGS=(run "TRAIN=$TRAIN")
              [ "$HOTFIX" = "true" ] && ARGS+=(--hotfix)
              [ "$FREEZE" = "true" ] && ARGS+=(--freeze-libs)
              [ -n "$TIMEOUT" ] && ARGS+=("--timeout=$TIMEOUT")
              for kv in $SETS; do ARGS+=(--set "$kv"); done
              observe_trainctl "${ARGS[@]}"
              ;;
            bump)
              [ -n "$TRAIN" ] || { echo "::error::phase=bump 需要 train 输入(列车号)"; exit 1; }
              ARGS=(bump "TRAIN=$TRAIN" --push)
              [ "$HOTFIX" = "true" ] && ARGS+=(--hotfix)
              for kv in $SETS; do ARGS+=(--set "$kv"); done
              ./bin/trainctl "${ARGS[@]}"
              ;;
            tag)     ./bin/trainctl tag ;;
            advance|auto) observe_trainctl advance ;;
            *) echo "::error::未知 phase $PHASE"; exit 1 ;;
          esac
