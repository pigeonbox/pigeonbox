name: Train Release

# ⚠️ 已废弃(v2 过渡期保留作回退):本工作流被 train-orchestrator.yml 取代——
# 忙等轮询(45/90 分钟)改事件回调+sweep,finalize 并入 trainctl advance。
# 1.20.0 首航 shipped 后删除。设计稿: docs/specs/2026-10-12-release-train-v2-design.md

# 发布列车编排器:preflight 对账 → 等镜像在位 → 等产物回挂 → finalize(hub v<train> Latest 快照)。
# 各仓打包由「合并 bump PR → version-tagger 打 tag → 既有 Release 流水线」驱动,
# 本工作流不 dispatch 各仓,只做门禁与定版(幂等可重入,失败修正后重跑跳过已完成项)。
# 设计稿: docs/specs/2026-10-08-release-train-design.md
#
# finalize 需要 secret TRAIN_PAT(对 pigeonbox/pigeonbox 有 contents:write 的 PAT;
# GITHUB_TOKEN 推 tag 不会触发 release.yml——防递归限制)。未配置时 finalize 显式失败,不静默。
on:
  workflow_dispatch:
    inputs:
      train:
        description: "列车号(缺省取 release/train.yaml 的 train)"
        required: false
        type: string
      mode:
        description: "verify=只对账+等产物;finalize=终验并出 hub 快照(Latest)"
        type: choice
        default: verify
        options: [verify, finalize]
      skip_wait:
        description: "跳过镜像/产物等待(重跑续验用;verify 阶段仍全量对账)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: train-release-${{ github.event.inputs.train }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      train: ${{ steps.t.outputs.train }}
    steps:
      - uses: actions/checkout@v7
      - id: t
        run: echo "train=$(bash scripts/release-train.sh get train)" >> "$GITHUB_OUTPUT"
      - name: preflight 对账
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-train.sh verify --ci

  wait-images:
    if: github.event.inputs.skip_wait != 'true'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 等 ghcr 镜像在位(server/frontend/p2p,上限 45 分钟)
        # 探测必须走 docker pull——ghcr registry HTTP API 对 runner 网段匿名请求恒 401
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SV=$(bash scripts/release-train.sh get images.server)
          PP=$(bash scripts/release-train.sh get lib.p2p); PP=${PP#v}
          for ref in "ghcr.io/pigeonbox/server:$SV" "ghcr.io/pigeonbox/frontend:$SV" "ghcr.io/pigeonbox/p2p:$PP"; do
            echo "等待 $ref ..."
            ok=0
            for i in $(seq 1 90); do
              if docker pull -q "$ref" >/dev/null 2>&1; then ok=1; break; fi
              sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::$ref 45 分钟内未发布——server Release 未跑或失败,禁止 finalize(会打出钉空气 tag 的包)"; exit 1; }
          done

  wait-artifacts:
    if: github.event.inputs.skip_wait != 'true'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 等 8 个组件回挂 tag 在 hub Release 页齐(上限 90 分钟)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS="$(bash scripts/release-train.sh get terminal.desktop.tag) $(bash scripts/release-train.sh get terminal.fnos.tag) \
            $(bash scripts/release-train.sh get terminal.openwrt.tag) p2p-$(bash scripts/release-train.sh get lib.p2p) \
            $(bash scripts/release-train.sh get terminal.synology.tag) $(bash scripts/release-train.sh get terminal.qnap.tag) \
            $(bash scripts/release-train.sh get terminal.ugreen.tag) $(bash scripts/release-train.sh get terminal.terramaster.tag)"
          echo "期望回挂: $TAGS"
          pending="$TAGS"
          for i in $(seq 1 90); do
            left=""
            for t in $pending; do
              n=$(gh api "repos/pigeonbox/pigeonbox/releases/tags/$t" --jq '.assets | length' 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then echo "  ✓ $t(资产 $n)"; else left="$left $t"; fi
            done
            pending="$left"
            [ -z "$pending" ] && { echo "✓ 全部回挂齐"; exit 0; }
            echo "  待回挂:$pending(60s 后重试,$i/90)"
            sleep 60
          done
          echo "::error::90 分钟内仍有回挂缺失:$pending——查对应仓 Release 工作流"
          exit 1

  finalize:
    if: github.event.inputs.mode == 'finalize'
    needs: [preflight, wait-images, wait-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 终验 + 出 hub 快照(需 TRAIN_PAT)
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_PAT: ${{ secrets.TRAIN_PAT }}
          TRAIN: ${{ needs.preflight.outputs.train }}
        run: |
          [ -n "$TRAIN_PAT" ] || {
            echo "::error::缺 secret TRAIN_PAT(GITHUB_TOKEN 推 tag 不触发 release.yml)。"
            echo "配置: gh secret set TRAIN_PAT -R pigeonbox/pigeonbox(对 hub 仓 contents:write 的 PAT);"
            echo "或本地跑 bash scripts/release-train.sh finalize(用本机 gh 凭证)。"
            exit 1
          }
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TRAIN_PAT}@github.com/${{ github.repository }}.git"
          git pull -q --ff-only origin main
          bash scripts/release-train.sh finalize --train "$TRAIN"
