name: Train Verify

# 发布列车常驻守卫:train.yaml ↔ 全生态真实状态对账(本地同款: make train-verify)。
# 漂移即失败并更新常驻 issue「🎯 train-drift」——版本不统一从人眼发现改为 CI 发现。
# 实现=release/trainctl verify(v2 状态机编排器,与 orchestrator 同一二进制)。
# 设计稿: docs/specs/2026-10-12-release-train-v2-design.md
on:
  schedule:
    - cron: "30 2 * * *" # 每日 02:30 UTC
  push:
    branches: [main]
    paths:
      - "release/train.yaml"
      - "release/trainctl/**"
      - "deploy/nas/**"
      - "deploy/k8s/**"
      - "docs/architecture.md"
  pull_request:
    paths:
      - "release/train.yaml"
      - "release/trainctl/**"
      - "deploy/nas/**"
      - "deploy/k8s/**"
      - "docs/architecture.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: train-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto # 覆盖 setup-go v7 的 GOTOOLCHAIN=local,地板再抬时自动拉取
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5；勿升 v7:强制 GOTOOLCHAIN=local,与 toolchain 地板冲突(job 里已显式 GOTOOLCHAIN=auto 覆盖)
        with:
          go-version: "1.26.10"
      - name: 对账(trainctl verify;全部公开仓,只读;GITHUB_TOKEN 足够)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p bin
          (cd release/trainctl && GOWORK=off go build -o "$GITHUB_WORKSPACE/bin/trainctl" .)
          ./bin/trainctl verify --ci 2>&1 | tee verify.log
      - name: 漂移开/更新常驻 issue(单 issue 追加,防刷屏)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create train-drift -R "$GITHUB_REPOSITORY" --color E99695 --description "发布列车版本漂移" --force 2>/dev/null || true
          {
            echo "检测到版本漂移($(date -u '+%F %T') UTC · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
            echo ""
            echo '```'
            tail -60 verify.log
            echo '```'
          } > body.md
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "train-drift in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body-file body.md
            echo "已更新常驻 issue #$NUM"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label train-drift \
              --title "🎯 train-drift: 发布列车版本漂移" --body-file body.md
          fi
