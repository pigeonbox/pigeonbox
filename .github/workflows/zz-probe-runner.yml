name: zz-probe-runner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/setup-go@40f1582b2485089dde7abd19f5b9a3f9e1a9e0d1e
        with:
          go-version: "1.26.10"
      - name: probe
        run: |
          set -x
          go version
          go env GOPROXY
          echo "--- 探针同款调用（空 module）---"
          d=$(mktemp -d); cd "$d"
          printf 'module probe\n\ngo 1.21\n' > go.mod
          GOWORK=off GOFLAGS=-mod=mod go mod download github.com/pigeonbox/contracts@v0.20.4; echo "EXIT=$?"
