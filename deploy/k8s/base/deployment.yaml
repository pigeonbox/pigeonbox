apiVersion: apps/v1
kind: Deployment
metadata:
  name: pigeonbox
  namespace: pigeonbox
  labels:
    app: pigeonbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pigeonbox
  template:
    metadata:
      labels:
        app: pigeonbox
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pigeonbox
          # 钉版（hub#360）：base 不用 latest——直接 `kubectl apply -k base` 或
          # 复制 base 做自己 overlay 的用户也拿到确定版本。升级统一走 overlay 的
          # images.newTag（trainctl bump 同步改写本行）；发布 tag 不可变 ⇒
          # IfNotPresent 不会像 latest 那样静默复用旧缓存层。
          image: ghcr.io/pigeonbox/server:6.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 12345
              name: http
            # Prometheus 独立指标端口（PB_METRICS_ADDR=0.0.0.0:9090）。
            # 与主端口分离：/metrics 不挂在 12345，公网 Ingress 不暴露该端口。
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: pigeonbox-config
            - secretRef:
                name: pigeonbox-secret
          # 存活探针：进程是否运行（轻量，不检查依赖）
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪探针：依赖（DB）就绪才接流量
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 启动探针：慢启动期间不被 liveness 杀死
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            failureThreshold: 18  # 最多等 3 分钟启动
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
          # 安全上下文：非 root + 全能力降权 + seccomp 基线（对齐 chart values）
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pigeonbox-data
