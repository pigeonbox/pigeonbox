apiVersion: apps/v1
kind: Deployment
metadata:
  name: pigeonbox-frontend
  namespace: pigeonbox
  labels:
    app: pigeonbox
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pigeonbox
      component: frontend
  template:
    metadata:
      labels:
        app: pigeonbox
        component: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          # 钉版（hub#360）：同 base/deployment.yaml——base 不用 latest，
          # 升级走 overlay 的 images.newTag（trainctl bump 同步改写本行）。
          image: ghcr.io/pigeonbox/frontend:6.0.0
          imagePullPolicy: IfNotPresent
          # 反代上游 = 后端 Service(镜像内 envsubst 渲染进 nginx 配置)
          env:
            - name: BACKEND_HOST
              value: pigeonbox
            - name: BACKEND_PORT
              value: "12345"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
