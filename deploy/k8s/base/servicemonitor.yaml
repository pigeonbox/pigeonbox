# ServiceMonitor 供 Prometheus Operator 抓取 /metrics（需集群已安装 kube-prometheus-stack）。
# 若集群未安装 prometheus-operator，可忽略本文件，改用传统 ServiceMonitor 或静态抓取配置。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pigeonbox
  namespace: pigeonbox
  labels:
    app: pigeonbox
    release: prometheus  # 按实际 prometheus release 名调整，匹配 prometheus 服务发现
spec:
  selector:
    matchLabels:
      app: pigeonbox
  namespaceSelector:
    matchNames:
      - pigeonbox
  # 把 Service 的 app 标签透传到指标；SLO 规则用 app="pigeonbox" 过滤，
  # 避免与共享 Prometheus 里其它 http_requests_total 混淆。
  targetLabels:
    - app
  endpoints:
    # 抓独立指标端口 9090（PB_METRICS_ADDR），不是主端口 12345——
    # core 的 /metrics 不在主端口注册（避免公网泄露内部指标）。
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
