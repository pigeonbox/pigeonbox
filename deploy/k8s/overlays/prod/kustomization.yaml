# 生产环境 overlay
# 用法: kubectl apply -k deploy/k8s/overlays/prod
#
# ⚠️ 部署前必须完成两件事（漏做会启动失败——这是刻意的 fail-fast）：
#   1. 编辑 base/secret.yaml 把 PB_JWT_SECRET 换成强随机值
#      (openssl rand -hex 32)。占位值在服务端黑名单中，直接 apply 会 crash-loop。
#   2. 下方面像 tag 钉到实际发布的版本(ghcr tag 无 v 前缀)，勿用 latest。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pigeonbox
resources:
  - ../../base
images:
  - name: ghcr.io/pigeonbox/server
    newTag: 5.4.0
  - name: ghcr.io/pigeonbox/frontend
    newTag: 5.4.0
# 生产覆盖：副本数 **必须保持 1**。
#
# ⚠️ 2026-11-06 P0 修正：此前这里写的是 value: 3，与本文件上方自己的注释
#    （「裸 manifest 直接对单 Deployment 扩副本…语义不成立」）直接矛盾，且
#    与 base 的三处单副本前提冲突：
#      1. database = sqlite（base/configmap.yaml）⇒ 同一 DB 文件被 3 个 Pod
#         经同一个 RWO PVC 并发写：迁移、后台任务（janitor/对账）、取件计次
#         全部多实例同跑 ⇒ 数据损坏面，而不是「性能更好」；
#      2. PVC accessModes = ReadWriteOnce ⇒ 多节点调度时第 2、3 个 Pod 只能
#         卡在 ContainerCreating（挂不上盘）；
#      3. base 未设 PB_DEPLOY_MODE ⇒ core 的「多副本必须拆 public/admin 拓扑」
#         fail-fast 拦不到 ⇒ 起得来、然后静静出错。
#
#    横向扩展的正确做法：换共享数据库（mysql/pg）+ 按 PB_DEPLOY_MODE 拆
#    public×N / admin×1 拓扑（charts 仓 pigeonbox chart 1.3.22+ 的
#    replicaCount>1 会渲染拆分布局）。裸 manifest 只支持单副本。
patches:
  - target:
      kind: Deployment
      name: pigeonbox
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
