#__NAS_PLATFORM_HEADER__
#
# 架构: 对外端口 → frontend(nginx 静态+API 反代) → pigeonbox(纯后端, 不发布端口)
# 数据: PB_DATA_DIR 指向的目录(SQLite 库 + 上传文件 + JWT 密钥), 挂后端容器
#       —— 备份这个目录 = 备份全部数据
# Redis: 默认不启用。core v0.14.0 起单机内存模式全功能免 Redis(匿名取件可用,
#        取件码映射重启丢失); 需要重启保留映射时解开文件尾 redis 段注释,
#        并在 .env 设 PB_REDIS_HOST=redis 后 docker compose up -d
#
# 同目录 .env 由平台安装包自动生成(或按各仓 README 手工准备),
# 改后 docker compose -p pigeonbox up -d 生效。

services:
  pigeonbox:
    image: ghcr.io/pigeonbox/server:${PB_IMAGE_TAG:-3.3.31}
    container_name: pigeonbox-server
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PB_SERVER_MODE=release
      - PB_PRODUCTION=1
      # JWT 密钥留空 → 容器首启自动生成强随机值并持久化到数据目录(重启/升级不丢)
      - PB_JWT_SECRET=${PB_JWT_SECRET:-}
      # 管理员密码:本编排默认 PB_PRODUCTION=1(生产模式),留空且库中无 admin 时
      # 后端拒绝启动(ErrInsecureDefaultAdmin)。必须设 PB_ADMIN_PASSWORD;
      # 或设 PB_DISABLE_DEFAULT_ADMIN=true 跳过默认管理员,走 /setup 向导建号
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - PB_DISABLE_DEFAULT_ADMIN=${PB_DISABLE_DEFAULT_ADMIN:-}
      # 首启令牌(可选): 设任意非空值后,首启建号页必须填对令牌才能建号。
      # 未初始化的实例上 /setup 无鉴权——谁先访问谁建号(setup-race)。
      # 公网部署建议设此项; 内网自托管留空即可(打开浏览器走完首启,零摩擦)。
      - PB_SETUP_TOKEN=${PB_SETUP_TOKEN:-}
      # 对外完整地址(生成分享链接用; 有域名/HTTPS 反代时在 .env 填)
      - PB_SERVER_BASE_URL=${PB_SERVER_BASE_URL:-}
      # NAS 场景默认关闭开放注册(管理员建号), 与 fnos 适配层同款
      - PB_USER_ALLOW_REGISTRATION=${PB_USER_ALLOW_REGISTRATION:-false}
      # 套反代/HTTPS 网关时填容器网段 CIDR, 否则限流按代理 IP 计数
      - PB_TRUSTED_PROXIES=${PB_TRUSTED_PROXIES:-}
      # 留空 = 单机内存模式; 启用下方 redis 段后设为 redis
      - PB_REDIS_HOST=${PB_REDIS_HOST:-}
      - PB_REDIS_PORT=${PB_REDIS_PORT:-6379}
      - PB_REDIS_PASSWORD=${PB_REDIS_PASSWORD:-}
    volumes:
      - ${PB_DATA_DIR:-./data}:/app/data
    # 核心启动逻辑前置: JWT 密钥为空时生成并写入数据卷(镜像内 busybox 实现)。
    # 与生态主仓 docker-compose.yml 逐字一致, 勿单方改动。
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$PB_JWT_SECRET" ] && [ -f /app/data/.jwt_secret ]; then
          PB_JWT_SECRET=$$(cat /app/data/.jwt_secret)
          export PB_JWT_SECRET
        fi
        if [ -z "$$PB_JWT_SECRET" ]; then
          PB_JWT_SECRET=$$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 48)
          export PB_JWT_SECRET
          printf '%s' "$$PB_JWT_SECRET" > /app/data/.jwt_secret
          chmod 600 /app/data/.jwt_secret
        fi
        # 首启逃逸门(2026-10-22 全生态统一): 未设管理员密码时不播种弱口令
        # admin/admin123, 改走 /setup 首启向导(浏览器里建号)。
        # 为什么这样更安全: 弱口令是**可被扫描器猜到**的; 未初始化实例要有人
        # 刻意访问 /setup 才能认领 —— 后者的暴露面小得多。
        # 已有实例零副作用: core 的 CreateDefaultAdmin 见到已有管理员直接返回。
        # 与 openwrt 的 procd 段同款条件(openwrt 2026-10-15 起即如此)。
        if [ -z "$$PB_ADMIN_PASSWORD" ]; then
          export PB_DISABLE_DEFAULT_ADMIN=true
        fi
        exec ./server --config ./config/config.yaml
    restart: unless-stopped
    # 必须显式 GET(/live 未注册 HEAD, --spider 会发 HEAD 得 404)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:12345/live"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/pigeonbox/frontend:${PB_IMAGE_TAG:-3.3.31}
    container_name: pigeonbox-frontend
    ports:
      - "${PB_API_BIND:-0.0.0.0}:${PB_API_PORT:-12345}:8080"
    environment:
      - BACKEND_HOST=pigeonbox
      - BACKEND_PORT=12345
      # nginx 反代体积上限——**物理防线,不是业务上限**。
      # 业务上限(单文件最大体积)在服务端:管理后台「上传设置」upload_ex.max_file_size,
      # presign init 阶段即拒超限文件(错误码 10010),不浪费任何流量。
      # ⚠️ 本值必须 >= 服务端 upload.max_file_size,否则 nginx 会先拒成 413
      #    (业务上限形同虚设;2026-10-23 真机事故=nginx 写死 1GiB + 后端不限)。
      - CLIENT_MAX_BODY_SIZE=${PB_MAX_BODY_SIZE:-8192m}
    depends_on:
      pigeonbox:
        condition: service_healthy
    restart: unless-stopped
    # localhost 会先解析 ::1, nginx 仅 IPv4 → 永远 refused, 必须用 127.0.0.1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 可选 Redis(默认关闭) ──
  # 解开本段与文件尾 volumes 注释, 并在 .env 设 PB_REDIS_HOST=redis 后 up -d:
  # 取件码映射/预签名/分布式限流改走 Redis, AOF 持久化重启不丢。
