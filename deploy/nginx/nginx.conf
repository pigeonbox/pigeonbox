# PigeonBox nginx 反向代理模板（v0.4+，与后端安全能力配套）。
#
# ── 部署必读：trusted_proxies ─────────────────────────────────────────
# 后端对 X-Forwarded-For 做 CIDR 可信校验（security.trusted_proxies）：
# 只有"直连对端"落在可信网段内才采信 XFF。nginx 反代部署必须做两件事之一，
# 否则限流/失败锁定全部按 nginx 的 IP 计数（所有用户共享一个限流桶、误锁）：
#   a) 在 PigeonBox 配置中把 nginx 所在网段加入可信列表，例如：
#        security:
#          trusted_proxies: ["172.18.0.0/16"]   # docker 网段按实际调整
#      （env: PB_TRUSTED_PROXIES=172.18.0.0/16）
#   b) 或保持 trusted_proxies 为空（此时后端忽略 XFF，按直连 IP 判定）——
#      仅当你接受"所有请求视为来自 nginx"时可行，不推荐。
# ──────────────────────────────────────────────────────────────────────
#
# ── 大小三配平 ────────────────────────────────────────────────────────
# nginx 的 client_max_body_size 必须 >= PigeonBox 的 upload.upload_size
# （单请求体上限，默认 10MB；直传分享/文本/登录表单都受它约束）。
# 分片通道单片只有 upload.chunk_size（默认 2MB）；整文件上限是
# upload.max_file_size（0=不限，管理后台在线可配）。三处语义：
#   client_max_body_size  >= upload.upload_size   （单请求硬顶，网关层）
#   upload.max_file_size  >= 整文件上限            （分片/预签名通道，0=不限）
#   upload.chunk_size      单片大小                （= 每个分片请求的 body）
#
# ⚠️ 2026-10-23 修正一处错误认知：此前这里写「大文件走分片/预签名，单片仍然很小，
# nginx 无需为大文件调大 body size」——**错的**。分片通道确实单片小，但
# **presign 直传是整文件一次 PUT**（前端 >100MB 恒走该通道，不分片），
# 所以 nginx 的 body 上限就是「单文件直传上限」的天花板。默认值 20M/1GiB 一旦
# 低于实际要传的文件，就是「大文件传到一半被 nginx 拒成 413」。
# 正确口径：**client_max_body_size 是物理防线，不是业务上限**——
# 业务上限在服务端 upload.max_file_size（管理后台可配，presign init 阶段即拒
# 超限文件，错误码 10010，零流量）；本值只须 >= 它，留足余量即可。
# ──────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # WebSocket 升级头映射（非 WS 请求置空，保持 keepalive）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 单请求体上限（**物理防线,非业务上限**;须 >= 服务端 upload.max_file_size,
    # 因 presign 直传是整文件一次 PUT——见文件头注释;按需调整）
    client_max_body_size 8192m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream pigeonbox {
        server pigeonbox-frontend:8080;   # compose: frontend 容器(静态+API 反代已收敛其中);
                                            # 指向纯后端时用 pigeonbox:12345;K8s/裸机按实际调整
        keepalive 32;
    }

    # 通用反代头（各 location 复用）
    # 必须 $http_host 而非 $host：后端按 Host 头推断公开 base（分享链接/预签回调），
    # $host 丢端口，非 80/443 部署推断出的链接端口错（10.10.10.3 真机事故根因）
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    server {
        listen 80;
        server_name localhost;   # 替换为实际域名

    # ── 安全响应头（2026-10-05 审计加固）────────────────────────
    # nosniff 防 MIME 嗅探；XFO SAMEORIGIN 防点击劫持；Referrer-Policy
    # 限制外泄取件码 URL。always 修饰使 4xx/5xx 同样携带。
    # 注: nginx add_header 继承规则——location 内出现任意 add_header 时
    # 不再继承上层,故下方 /assets/ 与 SPA 回退 location 内重复声明。
    # CSP: script-src 'self' + 'unsafe-eval'——vue-i18n 运行时消息编译依赖
    # new Function(输入=站点自有语言包,非用户输入;严格无 eval 会使 i18n
    # 全局崩溃白屏,2026-10-05 实测)。style-src unsafe-inline 予 Element
    # Plus;worker-src blob: 予 pdf.js。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        # 生产 HTTPS 部署：启用跳转并打开下方 443 server 块
        # return 301 https://$server_name$request_uri;

        # ── 下载/分片/预签名：流式透传 ──────────────────────────────
        # 关闭缓冲（大文件不过 nginx 缓冲区）、放宽超时（慢速大下载）。
        # X-Accel-Buffering 头由后端控制时此配置不冲突。
        location ~ ^/(share/download|chunk/|api/v1/presign|anonymous/download) {
            proxy_pass http://pigeonbox;
            proxy_buffering off;
            proxy_request_buffering off;   # 上传分片流式转发
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;       # 慢速大文件下载；按网络放宽
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # ── 带哈希的前端静态资源：长缓存（文件名含 hash，内容变更即改名）──
        # 注意 proxy_set_header 不继承：本 location 必须自带 XFF 头，
        # 否则后端收到的是客户端原始 XFF（nginx 会透传未覆写的头）
        location /assets/ {
            proxy_pass http://pigeonbox;
            expires 30d;
            add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 其余全部走后端（API + SPA 回退）────────────────────────
        # index.html 由后端 SPA 回退返回，禁止强缓存（发版后用户拿到旧页面的
        # 最常见原因就是这里加了 immutable/expires）
        location / {
            proxy_pass http://pigeonbox;
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # WebSocket：后端当前无 WS 端点，保留头部以备将来启用（无害）
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

# ── 子路径反代部署（上游 #247 诉求：挂在既有站点的 /pb/ 下）──────────
# 前端为 hash 路由（/#/...），子路径部署无需资源路径改写，仅需：
#   1. location 前缀 + 去前缀转发（下方 rewrite）
#   2. PigeonBox 的 server.base_url 配置为对外完整前缀地址
#      （如 https://example.com/fcb），分享链接/静态资源引用才能正确生成
