# PigeonBox 快速体验 / 自托管编排（前后端分离两容器）
#
#   cp .env.example .env          # 唯一必设项 PB_ADMIN_PASSWORD(默认生产模式,见下)
#   docker compose up -d          # 用 ghcr 发布镜像(两包均已 public 可匿名拉取)
#   BUILD=1 make compose-up       # 本地构建双镜像(= docker compose up -d --build)
#   docker compose --profile nginx up -d
#                                 # 加挂 deploy/nginx/nginx.conf 反代(占用 80,
#                                 # 须在 .env 设 PB_TRUSTED_PROXIES,见下)
#
# 架构(0.9.0 起,"server 镜像内嵌前端"模式已剔除):
#   对外端口 → pigeonbox-frontend(nginx: 静态资源 + API 反代)
#                → pigeonbox(server, 纯后端 API/数据, 不发布端口)
#   .env 的 PB_API_BIND/PB_API_PORT 语义不变,作用对象变为 frontend 容器。
#
# 数据持久化:./data(SQLite 库 + 上传文件 + .jwt_secret),挂在后端容器。
# Linux 裸 Docker(非 Desktop)宿主首次启动前: mkdir -p data && sudo chown 1000:1000 data
# (容器以 uid 1000 运行,bind 挂载目录 root 属主会导致库/密钥文件写不进)。
#
# JWT 密钥:PB_JWT_SECRET 未注入时,后端容器首启自动生成强随机值并持久化到
# ./data/.jwt_secret,重启/升级不丢;显式注入 .env 的 PB_JWT_SECRET 则以注入值为准
# (轮换即改 .env 后 up -d,旧会话全部失效)。生产建议显式注入。
#
# 反代必读:启用 nginx profile 时必须设 PB_TRUSTED_PROXIES=容器网段 CIDR
# (默认 bridge 池通常为 172.16.0.0/12 覆盖;精确值可用
#  docker network inspect <项目名>_default | grep Subnet 查询),
# 否则后端不采信 X-Forwarded-For,限流/失败锁定全部按代理的 IP 计数。
services:
  # ── 后端(server 镜像, 纯后端): 仅被 frontend 反代,不对外发布端口 ──
  # 需临时直连 API 调试时,自行给本服务加 "127.0.0.1:12345:12345" 端口映射。
  pigeonbox:
    image: ghcr.io/pigeonbox/server:${PB_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: pigeonbox
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PB_SERVER_MODE=${PB_SERVER_MODE:-release}
      - PB_PRODUCTION=${PB_PRODUCTION:-1}
      # 以下透传项留空 = 沿用安全默认(详见 docs/ENVIRONMENT_VARIABLES.md):
      # JWT 密钥留空 → entrypoint 自动生成并持久化(见文件头)
      - PB_JWT_SECRET=${PB_JWT_SECRET:-}
      # 管理员密码:本编排默认 PB_PRODUCTION=1(生产模式),留空且库中无 admin 时
      # 后端拒绝启动(ErrInsecureDefaultAdmin)。必须设 PB_ADMIN_PASSWORD;
      # 或设 PB_DISABLE_DEFAULT_ADMIN=true 跳过默认管理员,走 /setup 向导建号
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - PB_DISABLE_DEFAULT_ADMIN=${PB_DISABLE_DEFAULT_ADMIN:-}
      - PB_SETUP_TOKEN=${PB_SETUP_TOKEN:-}
      # 对外完整地址(反代/子路径部署生成分享链接用),直连可留空
      - PB_SERVER_BASE_URL=${PB_SERVER_BASE_URL:-}
      # 可信代理 CIDR(逗号分隔);反代部署必填,直连留空
      - PB_TRUSTED_PROXIES=${PB_TRUSTED_PROXIES:-}
      # Redis:匿名取件码映射/预签名/分布式限流/JWT 黑名单依赖。
      # 默认指向本编排内的 redis 服务;要禁用设 PB_REDIS_HOST= 为空
      # (core 内存模式列车起,置空=单机内存模式:匿名取件仍可用、重启丢失映射,
      #  此前镜像置空=匿名取件不可用;多副本模式缺 Redis 一律拒绝启动)
      - PB_REDIS_HOST=${PB_REDIS_HOST:-redis}
      - PB_REDIS_PORT=${PB_REDIS_PORT:-6379}
      - PB_REDIS_PASSWORD=${PB_REDIS_PASSWORD:-}
      # NAS 本地文件免上传导入/管理(挂载宿主目录后配白名单,如
      # volumes 加 ./import:/data/import 且 PB_LOCAL_IMPORT_ROOTS=/data/import)
      - PB_LOCAL_IMPORT_ENABLED=${PB_LOCAL_IMPORT_ENABLED:-}
      - PB_LOCAL_IMPORT_ROOTS=${PB_LOCAL_IMPORT_ROOTS:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    # 核心启动逻辑前置:JWT 密钥为空时生成并写入数据卷(镜像内 busybox 实现,
    # 不依赖 openssl)。显式注入 PB_JWT_SECRET 时跳过,不读写密钥文件。
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$PB_JWT_SECRET" ] && [ -f /app/data/.jwt_secret ]; then
          PB_JWT_SECRET=$$(cat /app/data/.jwt_secret)
          export PB_JWT_SECRET
        fi
        if [ -z "$$PB_JWT_SECRET" ]; then
          PB_JWT_SECRET=$$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 48)
          export PB_JWT_SECRET
          printf '%s' "$$PB_JWT_SECRET" > /app/data/.jwt_secret
          chmod 600 /app/data/.jwt_secret
        fi
        # 首启逃逸门(2026-10-22 全生态统一): 未设管理员密码时不播种弱口令
        # admin/admin123, 改走 /setup 首启向导(浏览器里建号)。
        # 为什么这样更安全: 弱口令是**可被扫描器猜到**的; 未初始化实例要有人
        # 刻意访问 /setup 才能认领 —— 后者的暴露面小得多。
        # 已有实例零副作用: core 的 CreateDefaultAdmin 见到已有管理员直接返回。
        # 与 openwrt 的 procd 段同款条件(openwrt 2026-10-15 起即如此)。
        if [ -z "$$PB_ADMIN_PASSWORD" ]; then
          export PB_DISABLE_DEFAULT_ADMIN=true
        fi
        exec ./server --config ./config/config.yaml
    restart: unless-stopped
    healthcheck: # 必须显式 GET(/live 未注册 HEAD,--spider 会发 HEAD 得 404)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:12345/live"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 前端(frontend 镜像, nginx 静态+反代): 对外唯一入口 ──
  # 端口语义与旧单容器版一致:PB_API_BIND/PB_API_PORT 作用于本容器(镜像监听 8080)。
  pigeonbox-frontend:
    image: ghcr.io/pigeonbox/frontend:${PB_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pigeonbox-frontend
    ports:
      # 默认仅本机回环(反代/本机使用);局域网访问在 .env 设 PB_API_BIND=0.0.0.0
      - "${PB_API_BIND:-127.0.0.1}:${PB_API_PORT:-12345}:8080"
    environment:
      # 反代上游 = 本编排的后端服务(与镜像 envsubst 默认值一致,显式写出便于理解)
      - BACKEND_HOST=pigeonbox
      - BACKEND_PORT=12345
      # nginx 反代体积上限(镜像默认 20m 是隐性瓶颈: 分片上传不受影响,但多文件 zip
      # 流式下载/大请求体会被 nginx 先拒;后端仍有 upload.upload_size 强校验)
      - CLIENT_MAX_BODY_SIZE=${PB_MAX_BODY_SIZE:-1024m}
    depends_on:
      pigeonbox:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: # 镜像内置同款;显式声明便于 compose 事件/depends_on 语义清晰
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]  # localhost 会先解析 ::1,nginx 仅 IPv4 → 永远 refused
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis(编排内置,开箱即用):匿名取件码仅存于 Redis(过期/次数/密码仍以
  # SQLite 为准)。AOF 持久化保证 redis 重启后取件码映射不丢;
  # 数据在命名卷 redisdata 中,不与 ./data(SQLite/上传文件)混放。
  redis:
    image: redis:7-alpine
    container_name: pigeonbox-redis
    # 密码接线（2026-10-05 审计遗留）：.env 设 PB_REDIS_PASSWORD 即两端生效
    # （server 侧 PB_REDIS_PASSWORD 已接同名变量）；未设时保持无密码——端口
    # 未对宿主发布，仅编排内网可达，但建议生产设置。
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$PB_REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$PB_REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    environment:
      - PB_REDIS_PASSWORD=${PB_REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选反代:docker compose --profile nginx up -d
  # 模板全文(deploy/nginx/nginx.conf)含 HTTPS/子路径部署注释块与大小配平说明。
  # 上游指向 frontend 容器(静态+反代已在其中收敛),TLS 终结/统一入口仍由它承担。
  nginx:
    image: nginx:alpine
    profiles: ["nginx"]
    container_name: pigeonbox-nginx
    ports:
      - "${PB_HTTP_PORT:-80}:8080"   # frontend 镜像(nginx-unprivileged)监听 8080
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pigeonbox-frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: # 用 127.0.0.1:nginx 仅绑 IPv4,localhost 在 alpine 先解析 ::1 会被拒
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redisdata:
